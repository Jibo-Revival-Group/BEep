name: BEep
# Beta = BEep BETA: its own bundle IDs and icon, so it installs next to BEep.
configs:
  Debug: debug
  Release: release
  Beta: release
options:
  bundleIdPrefix: com.jiborevival
  deploymentTarget:
    iOS: "16.0"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.11.1  # 0.12 needs iOS 17; BEep supports iOS 16 (iPhone 8/X)
targets:
  BEep:
    type: application
    platform: iOS
    sources: [BEep, Shared]
    scheme: {}  # Swift packages (Citadel) only build through a scheme
    dependencies:
      - target: BEepWidget
      - package: Citadel
    entitlements:
      path: BEep/BEep.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jiborevival.beep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiborevival.beep
        BEEP_NAME: BEep
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: com.jiborevival.beep.beta
          BEEP_NAME: BEep BETA
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconBeta
    info:
      path: BEep/Info.plist
      properties:
        CFBundleDisplayName: $(BEEP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: BEep looks for Jibo on your Wi-Fi and talks to it there.
        # Jibo's avahi advertises only SSH, under the robot's name.
        NSBonjourServices: [_ssh._tcp]
        # Any address: a robot's remote address may be plain http over a VPN. (iOS ignores
        # NSAllowsArbitraryLoads when NSAllowsLocalNetworking is also set, so it replaces it.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Take a photo to upload to Jibo.
        NSPhotoLibraryAddUsageDescription: Save Jibo's photos to your library.
        NSCalendarsFullAccessUsageDescription: Send your calendar to Jibo for your personal report.
        NSCalendarsUsageDescription: Send your calendar to Jibo for your personal report.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.jiborevival.beep.refresh]

  BEepWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [BEepWidget, Shared, BEep/Assets.xcassets]
    entitlements:
      path: BEepWidget/BEepWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jiborevival.beep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiborevival.beep.widget
        BEEP_NAME: BEep
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: com.jiborevival.beep.beta.widget
          BEEP_NAME: BEep BETA
    info:
      path: BEepWidget/Info.plist
      properties:
        CFBundleDisplayName: $(BEEP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: BEep looks for Jibo on your Wi-Fi and talks to it there.
        # Any address: a robot's remote address may be plain http over a VPN. (iOS ignores
        # NSAllowsArbitraryLoads when NSAllowsLocalNetworking is also set, so it replaces it.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
