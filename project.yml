name: BEep
options:
  bundleIdPrefix: com.jiborevival
  deploymentTarget:
    iOS: "16.0"
targets:
  BEep:
    type: application
    platform: iOS
    sources: [BEep, Shared]
    dependencies:
      - target: BEepWidget
    entitlements:
      path: BEep/BEep.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jiborevival.beep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiborevival.beep
        MARKETING_VERSION: "1.3.1"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BEep/Info.plist
      properties:
        CFBundleDisplayName: BEep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: BEep looks for Jibo on your Wi-Fi and talks to it there.
        # Jibo's avahi advertises only SSH, under the robot's name.
        NSBonjourServices: [_ssh._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Take a photo to upload to Jibo.
        NSPhotoLibraryAddUsageDescription: Save Jibo's photos to your library.
        NSCalendarsFullAccessUsageDescription: Send your calendar to Jibo for your personal report.
        NSCalendarsUsageDescription: Send your calendar to Jibo for your personal report.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.jiborevival.beep.refresh]

  BEepWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [BEepWidget, Shared, BEep/Assets.xcassets]
    entitlements:
      path: BEepWidget/BEepWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jiborevival.beep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiborevival.beep.widget
        MARKETING_VERSION: "1.3.1"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: BEepWidget/Info.plist
      properties:
        CFBundleDisplayName: BEep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: BEep looks for Jibo on your Wi-Fi and talks to it there.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
