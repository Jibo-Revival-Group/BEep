name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode 26 (iOS 26 SDK) gives the app Liquid Glass.
    runs-on: macos-26
    defaults:
      run:
        shell: bash  # adds pipefail, so `xcodebuild | tail` still fails the step on a build error
    steps:
      - uses: actions/checkout@v4

      - name: Real BEacon page for the simulator check
        uses: actions/checkout@v4
        with:
          repository: Jibo-Revival-Group/BEam
          ref: beta
          path: beam
          sparse-checkout: '@be/be/beacon/public'

      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen && xcodegen

      # Ad-hoc signed with the App Group entitlement (shared with the widget): AltStore/SideStore
      # read it from the IPA to set the group up, then re-sign with the user's account.
      - name: Build the IPA
        run: |
          xcodebuild -project BEep.xcodeproj -scheme BEep -configuration Release -sdk iphoneos \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -quiet build
          APP=dd/Build/Products/Release-iphoneos/BEep.app
          codesign -f -s - --entitlements BEepWidget/BEepWidget.entitlements "$APP/PlugIns/BEepWidget.appex"
          codesign -f -s - --entitlements BEep/BEep.entitlements "$APP"
          codesign -d --entitlements - "$APP" | grep -q group.com.jiborevival.beep
          codesign -d --entitlements - "$APP/PlugIns/BEepWidget.appex" | grep -q group.com.jiborevival.beep
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry BEep.ipa Payload

      - name: Simulator check (finds a robot over Bonjour, opens BEacon in the 5x1 theme)
        run: |
          # "Sign to Run Locally": the simulator takes App Groups from entitlements Xcode links in.
          xcodebuild -project BEep.xcodeproj -scheme BEep -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= -quiet build
          APP=dd/Build/Products/Debug-iphonesimulator/BEep.app
          python3 ci/fake-beacon.py beam/@be/be/beacon/public &
          # Advertise SSH under this Mac's own name, the way a Jibo's avahi does.
          dns-sd -R "$(scutil --get LocalHostName)" _ssh._tcp local 22 &
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          runtime = max((r for r in devices if 'iOS' in r), key=lambda r: [int(n) for n in re.findall(r'\d+', r)])
          print([d['udid'] for d in devices[runtime] if d['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.jiborevival.beep -BEepStayHome YES
          sleep 15
          xcrun simctl io "$UDID" screenshot home.png
          xcrun simctl terminate "$UDID" com.jiborevival.beep
          xcrun simctl launch "$UDID" com.jiborevival.beep
          sleep 20
          xcrun simctl io "$UDID" screenshot robot.png
          xcrun simctl terminate "$UDID" com.jiborevival.beep

      - name: Simulator check (iPhone features save a photo and send the calendar)
        run: |
          UDID=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; print([d['udid'] for ds in json.load(sys.stdin)['devices'].values() for d in ds][0])")
          xcrun simctl privacy "$UDID" grant photos-add com.jiborevival.beep
          xcrun simctl privacy "$UDID" grant calendar com.jiborevival.beep
          xcrun simctl launch "$UDID" com.jiborevival.beep -BEepPanel etc \
            -savePhotos.Test-Jibo YES -lowBattery.Test-Jibo YES -calendarMember.Test-Jibo zane
          sleep 25
          xcrun simctl io "$UDID" screenshot settings.png
          grep -q "photo downloaded" requests.log
          python3 -c "
          import base64, json
          sent = json.load(open('calendar.json'))
          assert sent['id'] == 'zane' and sent['isEnabled'] is True, sent
          prefix = 'data:text/calendar;base64,'
          assert sent['icalUrl'].startswith(prefix), sent['icalUrl'][:40]
          assert 'BEGIN:VCALENDAR' in base64.b64decode(sent['icalUrl'][len(prefix):]).decode()
          print('calendar sent for zane')"
          # BEep records a photo only after Photos accepted it.
          PREFS="$(xcrun simctl get_app_container "$UDID" com.jiborevival.beep data)/Library/Preferences/com.jiborevival.beep.plist"
          plutil -p "$PREFS" | tee saved.txt
          grep -q "photo-1" saved.txt
          xcrun simctl terminate "$UDID" com.jiborevival.beep

      - name: Simulator check (battery widget reads the shared reading)
        run: |
          UDID=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; print([d['udid'] for ds in json.load(sys.stdin)['devices'].values() for d in ds][0])")
          xcrun simctl launch "$UDID" com.jiborevival.beep -BEepWidgetPreview YES
          sleep 12
          xcrun simctl io "$UDID" screenshot widget.png
          # The reading must be in the App Group, where the widget reads it.
          xcrun simctl get_app_container "$UDID" com.jiborevival.beep groups | tee groups.txt
          GROUP="$(awk '/group.com.jiborevival.beep/ {print $2}' groups.txt)"
          plutil -p "$GROUP/Library/Preferences/group.com.jiborevival.beep.plist" | tee group.txt
          grep -q '"battery.Test-Jibo"' group.txt
          # An upgrade from 1.1 has robots only in the app's own storage: the next launch must
          # copy them into the App Group, where the widget's Jibo picker reads them.
          # Stop the stand-in robot so rediscovering it can't save the list instead.
          xcrun simctl terminate "$UDID" com.jiborevival.beep
          pkill -f fake-beacon.py; pkill dns-sd || true
          APPDATA="$(xcrun simctl get_app_container "$UDID" com.jiborevival.beep data)/Library/Preferences/com.jiborevival.beep"
          OLD=$(printf '[{"name":"Test-Jibo","host":"127.0.0.1"}]' | xxd -p | tr -d '\n')
          xcrun simctl spawn "$UDID" defaults write "$APPDATA" robots -data "$OLD"
          xcrun simctl spawn "$UDID" defaults delete "$GROUP/Library/Preferences/group.com.jiborevival.beep" robots
          xcrun simctl spawn "$UDID" defaults read "$GROUP/Library/Preferences/group.com.jiborevival.beep" robots && exit 1
          xcrun simctl launch "$UDID" com.jiborevival.beep -BEepStayHome YES
          sleep 8
          xcrun simctl spawn "$UDID" defaults read "$GROUP/Library/Preferences/group.com.jiborevival.beep" robots

      - name: Simulator check (converts a modded Jibo over SSH)
        run: |
          UDID=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; print([d['udid'] for ds in json.load(sys.stdin)['devices'].values() for d in ds][0])")
          python3 -m pip install -q --break-system-packages asyncssh || python3 -m pip install -q asyncssh
          mkdir -p fakerun
          python3 ci/fake-jibo-ssh.py 2222 "$PWD/fakerun" &
          sleep 3
          # A stand-in for PM that prints like it and ends the way it does.
          PM='echo "=== Step 1: Remount filesystem read-write ==="; sleep 2; echo "=== Step 2: Stage and install BEam and BEnch ==="; sleep 2; echo "BEam and BEnch install complete."; echo "Mode change requires a reboot. Rebooting now..."'
          xcrun simctl launch "$UDID" com.jiborevival.beep -BEepStayHome YES -BEepConvert 127.0.0.1 -BEepConvertPort 2222 -BEepConvertPM "$PM"
          sleep 25
          xcrun simctl io "$UDID" screenshot convert.png
          cat fakerun/commands.log
          grep -q "5x1-pm.started" fakerun/commands.log
          cat fakerun/5x1-pm.log
          grep -q "Rebooting now" fakerun/5x1-pm.log
          grep -q "5X1_PM_EXIT 0" fakerun/5x1-pm.log
          test ! -f fakerun/5x1-pm.started  # cleared when PM finished
          xcrun simctl terminate "$UDID" com.jiborevival.beep

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BEep
          path: |
            BEep.ipa
            home.png
            robot.png
            settings.png
            widget.png
            convert.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BEep.ipa --title "BEep $GITHUB_REF_NAME" --notes "# Changes:"$'\n'"- See the commit history"
